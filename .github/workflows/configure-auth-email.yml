name: Configure sign-in email

# Run by hand after changing the SMTP password secret or the email template (supabase/templates/otp.html).
# The password goes from the EMAIL_CODE secret straight to Supabase; it is never printed.
on:
  workflow_dispatch:
    inputs:
      smtp_user:
        description: SMTP login, also used as the From address
        required: true
        default: llakshitmathurr239@gmail.com
      smtp_host:
        description: SMTP server
        required: true
        default: smtp.gmail.com
      smtp_port:
        description: SMTP port (465 = SSL)
        required: true
        default: "465"

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/configure-auth-email.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_CODE }}
          SMTP_USER: ${{ inputs.smtp_user }}
          SMTP_HOST: ${{ inputs.smtp_host }}
          SMTP_PORT: ${{ inputs.smtp_port }}
