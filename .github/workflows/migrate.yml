name: Database migrations

# Applies supabase/migrations to the hosted project. Runs on main after CI passes, or by hand.
# Uses only the database password (secret SUPABASE_DB_PASSWORD) and project ref (SUPABASE_PROJECT_REF), through
# Supabase's IPv4 session pooler. It needs no Supabase access token, so there is nothing that expires.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Check settings
        id: check
        run: |
          if [ -z "$DB_PASSWORD" ] || [ -z "$PROJECT_REF" ] || [ -z "$DB_POOLER_HOST" ]; then
            echo "Missing SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_REF secrets or SUPABASE_DB_POOLER_HOST variable; skipping migrations." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply migrations
        if: steps.check.outputs.skip != 'true'
        run: |
          ENC=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          URL="postgresql://postgres.${PROJECT_REF}:${ENC}@${DB_POOLER_HOST}:5432/postgres"
          supabase migration list --db-url "$URL"
          supabase db push --db-url "$URL"
