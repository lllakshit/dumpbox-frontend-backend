name: Database migrations

# Applies supabase/migrations to the hosted project. Runs on main after CI passes, or by hand.
# Needs repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
# Without them the job only reports that it was skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets are not set; skipping migrations." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Link project
        if: steps.check.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        if: steps.check.outputs.skip != 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: steps.check.outputs.skip != 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
