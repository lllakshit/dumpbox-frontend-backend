name: Supabase keepalive

# Twice a day: write one row so the project is never idle (needs only the public key; no token that can expire).
# The daily Vercel cron (/v1/internal/purge) also touches the database, as a second safety net.
# Note: GitHub turns off scheduled workflows after 60 days without commits; re-enable from the Actions tab.
on:
  schedule:
    - cron: "23 2,14 * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/keepalive.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
